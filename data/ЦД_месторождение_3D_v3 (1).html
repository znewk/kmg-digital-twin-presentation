<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Программа «Цифровой двойник» · пилот Молдабек Восточный</title>
<style>
/* ================================================================
   ИНТЕРФЕЙС · тёмное стекло, тонкие линии, Cambria + моноширинный
   ================================================================ */
:root{
  --c-plast:#F0AE4A; --c-skv:#8FBAF0; --c-dob:#35D0C2;
  --c-abai:#4EA3F0; --c-nedra:#9B7BE8; --c-exist:#8A99A8;
  --bg0:#050810; --bg1:#0C1626;
  --glass:rgba(10,18,32,.8); --line:rgba(140,170,210,.22);
  --txt:#D7E2F2; --txt-dim:#7C8DA6;
  --mono:Consolas,"Courier New",monospace;
  --serif:Cambria,Georgia,serif;
  --ui:"Segoe UI",Calibri,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,var(--bg0),var(--bg1));font-family:var(--ui);color:var(--txt)}
#scene{position:fixed;inset:0}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}

.obj-label{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:#EAF2FF;background:rgba(8,14,26,.84);border:1px solid var(--line);
  padding:3px 8px;white-space:nowrap;border-left:2px solid var(--c-plast);
  transform:translate(10px,-50%);
}
.obj-label.small{font-size:10px;padding:2px 6px;opacity:.9}
.sys-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  color:#EAF2FF;background:rgba(8,14,26,.9);border:1px solid var(--line);
  padding:3px 7px;white-space:nowrap;border-top:2px solid var(--c-nedra);
  transform:translate(-50%,-120%);line-height:1.5;
}
.sys-label b{font-weight:700;letter-spacing:.16em}
.obj-label.persist{opacity:.78;font-size:10px;padding:2px 6px;border-left-width:2px;background:rgba(8,14,26,.7)}

/* --- легенда источника систем --- */
#legend{position:fixed;left:16px;bottom:70px;z-index:20;width:352px;max-width:calc(100vw - 32px);
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);padding:10px 14px;display:none}
#legend.vis{display:block}
#legend h3{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--lgc,#9B7BE8);margin-bottom:6px}
.lg-row{display:flex;gap:8px;padding:3px 0;border-top:1px solid rgba(140,170,210,.1);font-size:11px;line-height:1.35}
.lg-row:first-of-type{border-top:none}
.lg-m{font-family:var(--mono);font-size:10px;letter-spacing:.06em;flex:0 0 128px;text-transform:uppercase}
.lg-d{color:var(--txt-dim)}
#cap-legend{margin-top:8px;text-align:left;max-width:860px;margin-left:auto;margin-right:auto;
  column-count:2;column-gap:26px}
#cap-legend .lg-row{break-inside:avoid}
@media (max-width:900px){ #cap-legend{column-count:1} }

/* --- шапка --- */
#hdr{position:fixed;top:16px;left:16px;z-index:20;max-width:352px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);padding:14px 16px 12px}
#hdr h1{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.3}
#hdr .sub{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--txt-dim);margin-top:4px;text-transform:uppercase}
#twins{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.twbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--txt);
  font-family:var(--ui);font-size:13px;padding:8px 10px;transition:background .2s,border-color .2s}
.twbtn .dot{width:9px;height:9px;flex:0 0 9px;border:1px solid rgba(255,255,255,.35)}
.twbtn .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--txt-dim);letter-spacing:.1em}
.twbtn:hover{background:rgba(255,255,255,.07)}
.twbtn.active{border-color:var(--tc);background:rgba(255,255,255,.06)}
.twbtn.active .cnt{color:var(--tc)}
#sysrow{display:flex;gap:5px;margin-top:12px}
.sf{flex:1;cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--txt-dim);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:6px 2px;transition:color .2s,border-color .2s}
.sf:hover{color:var(--txt)}
.sf.on{color:var(--sc);border-color:var(--sc)}
#btn-vend{margin-top:6px;width:100%;cursor:pointer;background:transparent;border:1px solid var(--line);
  color:var(--txt-dim);font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding:5px}
#btn-vend.on{color:var(--c-nedra);border-color:var(--c-nedra)}
#btn-show{margin-top:10px;width:100%;cursor:pointer;background:transparent;border:1px solid var(--c-plast);
  color:var(--c-plast);font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;padding:8px}
#btn-show:hover{background:rgba(240,174,74,.1)}

/* --- панель процессов --- */
#panel{position:fixed;top:16px;right:16px;bottom:70px;width:372px;max-width:calc(100vw - 32px);z-index:20;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);
  transform:translateX(110%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
#panel.open{transform:translateX(0)}
#panel header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#panel header h2{font-family:var(--serif);font-size:16px;font-weight:600}
#panel header .scope{font-size:12px;color:var(--txt-dim);margin-top:6px;line-height:1.45}
#plist{overflow-y:auto;flex:1;padding:8px}
#plist::-webkit-scrollbar{width:6px}
#plist::-webkit-scrollbar-thumb{background:rgba(140,170,210,.3)}
.proc{display:block;width:100%;text-align:left;cursor:pointer;background:transparent;color:var(--txt);
  border:1px solid transparent;border-left:2px solid var(--line);padding:8px 10px;margin-bottom:4px;
  font-family:var(--ui);transition:background .15s,border-color .15s}
.proc:hover{background:rgba(255,255,255,.05)}
.proc.sel{border-color:var(--tc);background:rgba(255,255,255,.06)}
.proc.linked{border-left-color:var(--tc)}
.proc.dim{opacity:.35}
.proc .n{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--tc)}
.proc .t{font-size:13px;font-weight:600;margin-top:2px;line-height:1.3}
.proc .d{font-size:11.5px;color:var(--txt-dim);margin-top:3px;line-height:1.4}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.badge{font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:2px 6px;
  border:1px solid var(--bc);color:var(--bc);white-space:nowrap;text-transform:uppercase}

/* --- строка состояния --- */
#status{position:fixed;left:16px;right:16px;bottom:16px;z-index:20;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:6px;padding:6px 10px;flex-wrap:wrap}
#hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt-dim);
  flex:1 1 200px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tgl{cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--txt-dim);
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:5px 9px;transition:color .2s,border-color .2s;white-space:nowrap}
.tgl:hover{color:var(--txt)}
.tgl.on{color:var(--c-dob);border-color:var(--c-dob)}
#clipwrap{display:none;align-items:center;gap:6px}
#clipwrap.vis{display:flex}
#clip{width:110px;accent-color:var(--c-dob)}

/* --- режим показа --- */
#showbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;flex-direction:column;align-items:center;
  padding:0 24px 18px;pointer-events:none}
body.show #showbar{display:flex}
body.show #hdr, body.show #panel, body.show #status{display:none}
#cap{max-width:1100px;text-align:center;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(8px);padding:14px 28px 12px;pointer-events:auto}
#cap .ch{font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--cc,#F0AE4A)}
#cap .t{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1.2;margin-top:4px}
#cap .d{font-size:17px;color:var(--txt-dim);margin-top:6px;line-height:1.4}
#cap-sys{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:8px}
#prog{display:flex;gap:3px;margin-top:10px;height:4px;width:min(760px,80vw)}
#prog .cell{flex:1;background:rgba(140,170,210,.18)}
#prog .cell.gap{flex:0 0 10px;background:transparent}
#prog .cell.done{background:var(--cc,#F0AE4A)}
#showhint{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt-dim);margin-top:8px}

/* --- титульная плашка главы --- */
#plate{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .6s}
#plate.vis{opacity:1}
#plate .inner{text-align:center;background:rgba(6,11,20,.86);border-top:1px solid var(--pc,#F0AE4A);
  border-bottom:1px solid var(--pc,#F0AE4A);padding:44px 8vw;width:100%}
#plate .k{font-family:var(--mono);font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--pc,#F0AE4A)}
#plate .n{font-family:var(--serif);font-size:46px;font-weight:600;margin-top:10px;line-height:1.15}
#plate .c{font-family:var(--mono);font-size:13px;letter-spacing:.2em;color:var(--txt-dim);margin-top:12px;text-transform:uppercase}

/* --- пустой режим (только 3D) --- */
body.clean #hdr, body.clean #panel, body.clean #status, body.clean #showbar{display:none !important}

button:focus-visible{outline:1px solid var(--c-skv);outline-offset:2px}

/* --- загрузка --- */
#loader{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,var(--bg0),var(--bg1));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
#loader.done{opacity:0;pointer-events:none}
#loader .lt{font-family:var(--serif);font-size:20px}
#loader .lm{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--txt-dim)}
#barw{width:280px;height:2px;background:rgba(140,170,210,.18)}
#bar{width:0%;height:100%;background:var(--c-plast);transition:width .2s}

@media (max-width:768px){
  #hdr{max-width:calc(100vw - 32px)}
  #panel{top:auto;height:42vh;bottom:70px}
  #cap .t{font-size:20px}
}
@media (prefers-reduced-motion:reduce){ #panel,#plate{transition:none} }
</style>
</head>

<div id="loader">
  <div class="lt">Цифровой двойник месторождения</div>
  <div id="barw"><div id="bar"></div></div>

</div>

<div id="scene"></div>
<div id="labels"></div>

<div id="hdr">
  <h1>Программа «Цифровой двойник»</h1>

  <div id="twins"></div>
  <div id="sysrow">

    <button class="sf" id="sf-EXIST" style="--sc:var(--c-exist)">EXIST</button>
  </div>
  <button id="btn-vend">Скрыть названия вендора</button>
  <button id="btn-show">Показ</button>
</div>

<aside id="panel" aria-label="Процессы контура">
  <header><h2 id="p-name"></h2><div class="scope" id="p-scope"></div></header>
  <div id="plist"></div>
</aside>

<div id="legend"><h3 id="legend-h"></h3><div id="legend-b"></div></div>

<div id="status">
  <div id="hint">Вращение — мышь · выберите контур или запустите показ</div>
  <button class="tgl on" id="tg-names">Подписи</button>

  <button class="tgl on" id="tg-flow">Поток</button>
  <button class="tgl on" id="tg-tele">Телеметрия</button>
  <button class="tgl" id="tg-sys">Сист. слой</button>
  <button class="tgl" id="tg-clean">Скрыть UI</button>
  <button class="tgl" id="btn-cam">Камера</button>
</div>

<div id="showbar">
  <div id="cap">
    <div class="ch" id="cap-ch"></div>
    <div class="t" id="cap-t"></div>
    <div class="d" id="cap-d"></div>
    <div id="cap-sys"></div>
    <div id="cap-legend"></div>
    <div id="prog"></div>
    <div id="showhint">→ / Space — дальше · ← — назад · A — авто · F — весь экран · Esc — выход</div>
  </div>
</div>

<div id="plate"><div class="inner">
  <div class="k" id="plate-k"></div>
  <div class="n" id="plate-n"></div>
  <div class="c" id="plate-c"></div>
</div></div>

const REG = new Map();
function ensureEntry(id, twin){
  if(!REG.has(id)) REG.set(id, { twin, meshes:[], anchor:null, labelObj:null, labelParent:null, sysObj:null });
  return REG.get(id);
}
function reg(id, twin, obj, anchor, labelParent){
  const e = ensureEntry(id, twin);
  obj.traverse(n => {
    if(n.isMesh || n.isLine || n.isPoints){
      if(!n.userData.ids) n.userData.ids = [];
      if(!n.userData.ids.includes(id)) n.userData.ids.push(id);
      if(!n.userData.twin) n.userData.twin = twin;
      e.meshes.push(n);
    }
  });
  if(anchor){ e.anchor = anchor.clone(); e.labelParent = labelParent || obj; }
  return e;
}

const HW = 700, HD = 450;
const OWC_Y = -520;

function fbm(x, z){
  return Math.sin(x*0.006 + z*0.009) * 0.55
       + Math.sin(x*0.017 - z*0.013 + 1.7) * 0.30
       + Math.sin(x*0.037 + z*0.031 + 4.2) * 0.15;
}
function dome(x, z){
  return Math.exp(-((x*x)/(460*460) + (z*z)/(340*340)));
}
const sstep = t => { t = Math.min(1, Math.max(0, t)); return t*t*(3-2*t); };
function faultTraceX(depth, z){ return 430 + 0.5*(depth + 40) + 0.12*z; }
function throwAt(x, z, depth){ return -60 * sstep((x - faultTraceX(depth, z))/26 + 0.5); }

const yResTop  = (x,z)=> -540 + 95*dome(x,z) + 10*fbm(x,z)            + throwAt(x,z,-540);
const yResBot  = (x,z)=> -700 + 80*dome(x,z) + 9*fbm(x,z)             + throwAt(x,z,-700);
const yCapTop  = (x,z)=> -480 + 90*dome(x,z) + 10*fbm(x*1.2,z*1.2)    + throwAt(x,z,-480);
const yOverTop = (x,z)=> -180 + 34*dome(x,z) + 12*fbm(x,z)            + throwAt(x,z,-180);

const PADS = [ [180,-120],[420,160],[60,300],[300,-340],[-280,80],[-120,-320],[-520,-140],[520,-220],
               [-650,170],[-560,-50],[-430,-250],[-240,-390],[-80,-100],
               [100,-20],[320,-40],[620,-60],[700,-210],[240,120],[-360,220],[-140,320],[200,-440],[120,-450] ];
function surfY(x, z){
  let damp = 1;
  for(const p of PADS){
    const d2 = (x-p[0])*(x-p[0]) + (z-p[1])*(z-p[1]);
    damp *= 1 - Math.exp(-d2/(85*85));
  }
  return (7*fbm(x*0.9, z*0.9)) * damp;
}

/* ---------- Построитель слоя: кровля + подошва + стенки блока ---------- */
const SEG_X = 52, SEG_Z = 36;
function makeLayerGeometry(topFn, botFn){
  const nx = SEG_X+1, nz = SEG_Z+1;
  const pos = [], idx = [];
  for(let pass=0; pass<2; pass++){
    const fn = pass===0 ? topFn : botFn;
    for(let j=0;j<nz;j++) for(let i=0;i<nx;i++){
      const x = -HW + 2*HW*i/SEG_X, z = -HD + 2*HD*j/SEG_Z;
      pos.push(x, fn(x,z), z);
    }
  }
  const T=(i,j)=>j*nx+i, B=(i,j)=>nx*nz+j*nx+i;
  for(let j=0;j<SEG_Z;j++) for(let i=0;i<SEG_X;i++){
    idx.push(T(i,j),T(i,j+1),T(i+1,j),  T(i+1,j),T(i,j+1),T(i+1,j+1));
    idx.push(B(i,j),B(i+1,j),B(i,j+1),  B(i+1,j),B(i+1,j+1),B(i,j+1));
  }
  for(let i=0;i<SEG_X;i++){
    idx.push(T(i,0),T(i+1,0),B(i,0),  T(i+1,0),B(i+1,0),B(i,0));
    idx.push(T(i,SEG_Z),B(i,SEG_Z),T(i+1,SEG_Z),  T(i+1,SEG_Z),B(i,SEG_Z),B(i+1,SEG_Z));
  }
  for(let j=0;j<SEG_Z;j++){
    idx.push(T(0,j),B(0,j),T(0,j+1),  T(0,j+1),B(0,j),B(0,j+1));
    idx.push(T(SEG_X,j),T(SEG_X,j+1),B(SEG_X,j),  T(SEG_X,j+1),B(SEG_X,j+1),B(SEG_X,j));
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

}

// Радиус кровли на уровне L вдоль луча (бинарный поиск, кровля монотонно падает от свода)
function ringRadius(cx, cz, L){
  let lo=0, hi=1000;
  for(let it=0;it<30;it++){
    const mid=(lo+hi)/2;
    (yResTop(cx*mid, cz*mid) > L) ? lo=mid : hi=mid;
  }
  return (lo+hi)/2;
}

const barGeoCache = new THREE.CylinderGeometry(1,1,1,6);
function barBetween(p1, p2, r, mat){
  const dir = p2.clone().sub(p1), len = dir.length();
  const m = new THREE.Mesh(barGeoCache, mat);
  m.scale.set(r, len, r);
  m.position.copy(p1).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(V3(0,1,0), dir.clone().normalize());
  return m;
}
function instancedBars(list, mat){
  const inst = new THREE.InstancedMesh(barGeoCache, mat, list.length);
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new THREE.Vector3(), P = new THREE.Vector3();
  list.forEach((b,i)=>{
    const dir = b[1].clone().sub(b[0]), len = dir.length();
    P.copy(b[0]).addScaledVector(dir, 0.5);
    Q.setFromUnitVectors(V3(0,1,0), dir.clone().normalize());
    S.set(b[2], len, b[2]);
    M.compose(P,Q,S);
    inst.setMatrixAt(i, M);
  });
  return inst;
}

/* ---------- Степная растительность (инстансы) ---------- */
{
  const N = LOW ? 50 : 100;
  const bush = new THREE.InstancedMesh(new THREE.ConeGeometry(1,1,6),
    new THREE.MeshStandardMaterial({ color:'#4A5540', roughness:1, transparent:true, opacity:0.9 }), N);
  const M=new THREE.Matrix4(), Q=new THREE.Quaternion(), S=new THREE.Vector3(), P=new THREE.Vector3();
  let placed = 0, guard = 0;
  while(placed < N && guard++ < 4000){
    const x = (Math.random()*2-1)*(HW-40), z = (Math.random()*2-1)*(HD-40);
    let near = false;
    for(const pd of PADS){ if((x-pd[0])**2+(z-pd[1])**2 < 90*90){ near=true; break; } }
    if(near) continue;
    const s = 2+Math.random()*3.4;
    P.set(x, surfY(x,z)+s/2, z); S.set(s*0.8, s, s*0.8);
    M.compose(P,Q,S);
    bush.setMatrixAt(placed++, M);
  }
  bush.count = placed;
  grSurf.add(bush);
  reg('s-terrain', 'dob', bush);
}

function padBase(x, z, w, d){
  const g = new THREE.Group(); g.position.set(x, surfY(x,z), z);
  const plate = new THREE.Mesh(new THREE.BoxGeometry(w, 2, d),
    new THREE.MeshStandardMaterial({ color:'#2A3646', roughness:1, transparent:true, opacity:0.95 }));
  plate.position.y = 1; g.add(plate);
  return g;
}
function berm(g, w, d, h=4.5, t=7){
  const bm = new THREE.MeshStandardMaterial({ color:'#3B4456', roughness:1, transparent:true, opacity:1 });
  for(const [ww,dd,px,pz] of [[w,t,0,-d/2],[w,t,0,d/2],[t,d,-w/2,0],[t,d,w/2,0]]){
    const wall = new THREE.Mesh(new THREE.BoxGeometry(ww,h,dd), bm);
    wall.position.set(px, h/2, pz); g.add(wall);
  }
}
function dummyHead(g, dx, dz){

/* ---------- Дороги: кольцевой проезд + подъезды ---------- */
function ribbonPts(samples, width, mat){
  const pos=[], idx=[];
  for(let i=0;i<samples.length;i++){
    const p=samples[i];
    const q=samples[Math.min(i+1, samples.length-1)];
    const dir=V3(q.x-p.x,0,q.z-p.z);
    if(dir.lengthSq()<1e-6) dir.set(1,0,0);
    dir.normalize();
    const px=-dir.z*width/2, pz=dir.x*width/2;
    pos.push(p.x-px, p.y, p.z-pz, p.x+px, p.y, p.z+pz);
  }
  for(let i=0;i<samples.length-1;i++){
    const a=i*2;
    idx.push(a,a+1,a+2, a+1,a+3,a+2);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}

const flowPipeMats = [];
{
  const g = new THREE.Group();
  const mkTex = window.__mkFlowTex;
  const pipeMats = {
    oil:   new THREE.MeshStandardMaterial({ color:'#7A7466', metalness:0.7, roughness:0.35, transparent:true, opacity:1 }),
    water: new THREE.MeshStandardMaterial({ color:'#5A7490', metalness:0.7, roughness:0.35, transparent:true, opacity:1 }),
    chem:  new THREE.MeshStandardMaterial({ color:'#6E8280', metalness:0.7, roughness:0.35, transparent:true, opacity:1 })
  };
  const flowSpec = { oil:{c:COL_OIL, v:0.5}, water:{c:COL_WATER, v:0.32}, chem:{c:COL_CHEM, v:0.75} };
  const postMat = matSteelD();

  // extraIds — дополнительные id для регистрации сегмента (нефтесбор, ППД, напорный)
  function pipe(waypoints, sys, opts={}){
    const { trench=false, r=2.4, extraIds=[] } = opts;
    const pts = waypoints.map(([x,z]) => V3(x, surfY(x,z) + (trench ? 1.2 : 5), z));
    const curve = new THREE.CatmullRomCurve3(pts);
    const seg = Math.max(18, Math.round(curve.getLength()/20));
    const shell = new THREE.Mesh(new THREE.TubeGeometry(curve, seg, r, 8), pipeMats[sys]);
    g.add(shell);
    const spec = flowSpec[sys];
    const tex = mkTex(spec.c);
    tex.repeat.set(Math.max(3, Math.round(curve.getLength()/95)), 1);
    const fm = new THREE.MeshBasicMaterial({ map:tex, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false });
    flowPipeMats.push({ mat:fm, speed:spec.v });
    const flow = new THREE.Mesh(new THREE.TubeGeometry(curve, seg, r*0.55, 6), fm);
    g.add(flow);
    for(const id of extraIds){ reg(id, 'dob', shell); reg(id, 'dob', flow); }
    if(!trench){
      const L = curve.getLength(), n = Math.floor(L/70);
      for(let i=1;i<n;i++){
        const p = curve.getPointAt(i/n), gy = surfY(p.x,p.z);
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.8,0.8,Math.max(p.y-gy,1),6), postMat);
        post.position.set(p.x,(p.y+gy)/2,p.z);
        g.add(post);
        for(const id of opts.extraIds || []) reg(id, 'dob', post);
      }
    }
  }
  // НЕФТЬ: ветка нефтесбора из 5 КП (магистраль КП1→…→КП5→МФНС)
  pipe([...KP_POS, [100,-20]], 'oil', { extraIds:['s-neftesbor'] });
  // кусты нефтяного фонда и одиночные устья → МФНС
  pipe([[180,-120],[140,-70],[100,-20]], 'oil');
  pipe([[420,160],[260,60],[100,-20]], 'oil');
  pipe([[60,300],[80,140],[100,-20]], 'oil', { trench:true });
  pipe([[300,-340],[200,-180],[100,-20]], 'oil', { trench:true });
  pipe([[520,-220],[300,-130],[100,-20]], 'oil');
  // МФНС → СП
  pipe([[100,-20],[210,-30],[320,-40]], 'oil');
  // НАПОРНЫЙ нефтепровод: СП → ЦППН «Кенбай»
  pipe([[320,-40],[460,-50],[562,-56]], 'oil', { r:3.2, extraIds:['s-napor'] });
  // ВОДА ППД: КНС → нагнетательные устья
  pipe([[-360,220],[-320,150],[-280,80]], 'water', { extraIds:['s-ppd-line'] });
  pipe([[-360,220],[-260,-40],[-180,-200],[-120,-320]], 'water', { extraIds:['s-ppd-line'] });
  // РЕАГЕНТ: БРХ → точки подачи (куст 1, КП-5, СП)
  pipe([[240,120],[210,0],[180,-120]], 'chem', { r:1.5 });
  pipe([[240,120],[80,20],[-80,-100]], 'chem', { r:1.5, trench:true });
  pipe([[240,120],[280,40],[320,-40]], 'chem', { r:1.5 });
  grSurf.add(g);
  reg('s-pipes', 'dob', g, V3(400, 20, -46), grSurf);
}

function applyState(){
  let focus = null;
  const twin = state.twin;
  const idxActive = state.hoverIdx !== null ? state.hoverIdx : state.procIdx;
  if(twin !== null && idxActive !== null) focus = expand(TWINS[twin].procs[idxActive].f);
  else if(state.linkedIds) focus = state.linkedIds;
  else if(state.sysFilter) focus = SYS_COVER[state.sysFilter];
  state.focus = focus || new Set();

  for(const f of Object.values(FEATURES)){
    f.group.visible = f.on || f.ids.some(id => state.focus.has(id));
  }
  featTele.visible = state.tele;

  const accent = state.sysFilter && !(twin && idxActive!==null) && !state.linkedIds
    ? SYS_COLORS[state.sysFilter] : null;

  for(const m of allMeshes){
    const ids = m.userData.ids || [], mTwin = m.userData.twin;
    const b = m.userData.base, t = m.userData.tgt;
    const inFocus = focus && ids.some(id => focus.has(id));
    if(focus){
      if(inFocus){ t.opacity=Math.max(b.opacity,0.92); t.eInt=1; t.desat=0; t.pulse=true; }
      else if(twin && mTwin===twin && !accent){ t.opacity=b.opacity*0.45; t.eInt=0; t.desat=0.35; t.pulse=false; }
      else { t.opacity=Math.min(b.opacity,0.12); t.eInt=0; t.desat=0.85; t.pulse=false; }
    } else if(twin){
      if(mTwin===twin){ t.opacity=b.opacity; t.eInt=b.eInt; t.desat=0; t.pulse=false; }
      else { t.opacity=Math.min(b.opacity,0.12); t.eInt=0; t.desat=0.85; t.pulse=false; }
    } else { t.opacity=b.opacity; t.eInt=b.eInt; t.desat=0; t.pulse=false; }
    t.pulseColor = accent;
  }
  if(outlinePass){
    const sel = [];
    if(focus) for(const id of focus){
      const e = REG.get(id);
      if(e) for(const m of e.meshes) if(m.isMesh) sel.push(m);
    }
    outlinePass.selectedObjects = sel;
    outlinePass.visibleEdgeColor.set(accent || (twin ? TWIN_COLORS[twin] : '#F0AE4A'));
  }
  updateLabels();
  updateNodeLabels();
  updateSysLabels();
}

  const div = document.createElement('div');

  div.textContent = (LABELS[id] || id).toUpperCase();
  const lo = new CSS2DObject(div);
  lo.position.copy(e.anchor);
  lo.visible = false;
  (e.labelParent || scene).add(lo);
  e.labelObj = lo;
}

    if(e.labelObj) e.labelObj.visible = show;
  }
}

  if(!e || !e.anchor || e.sysObj || !OBJ_MODULES.has(id)) return;
  const div = document.createElement('div');
  div.className = 'sys-label';
  const first = OBJ_MODULES.get(id)[0];
  div.style.borderTopColor = SYS_COLORS[first.s];
  div.innerHTML = sysLabelHTML(id);
  const lo = new CSS2DObject(div);
  lo.position.copy(e.anchor).add(V3(0, 26, 0));
  lo.visible = false;
  (e.labelParent || scene).add(lo);
  e.sysObj = lo;
}

const SYS_LABEL_IDS = [ 'res-grid','res-map','res-seismic','res-oil','res-flood',
  'w-prod-1','w-prod-2','w-prod-3','w-prod-4','w-inj-1','w-drill','w-workover',
  's-kp','s-mfns','s-sp','s-napor','s-cppn','s-brh','s-kns','s-vl','s-ps','s-cio','s-pad-1' ];
function updateSysLabels(){
  const inProc = state.show && state.showSysIds;
  const ids = new Set(SYS_LABEL_IDS);
  if(inProc) for(const id of state.showSysIds) ids.add(id);
  for(const [id, e] of REG){
    if(!e.sysObj && !ids.has(id)) continue;
    let show = false;
    if(inProc){
      show = state.showSysIds.has(id) && OBJ_MODULES.has(id) && !!e.anchor;
      if(show){
        ensureSysLabel(id);
        if(e.sysObj) e.sysObj.element.innerHTML = sysLabelHTML(id, state.procSys);
      }
    } else if(state.sysLayer && SYS_LABEL_IDS.includes(id)){
      show = true;
      if(state.sysFilter) show = (OBJ_MODULES.get(id) || []).some(sm => sm.s === state.sysFilter);
      if(show){
        ensureSysLabel(id);
        if(e.sysObj) e.sysObj.element.innerHTML = sysLabelHTML(id);
      }
    }
    if(e.sysObj) e.sysObj.visible = show;

const raycaster = new THREE.Raycaster();
raycaster.params.Line = { threshold: 8 };
const ptr = new THREE.Vector2();
let downPos = null;
renderer.domElement.addEventListener('pointerdown', e=>{ downPos=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!downPos) return;
  const moved = Math.hypot(e.clientX-downPos[0], e.clientY-downPos[1]);
  downPos = null;
  if(moved>6 || state.show) return;
  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(ptr, camera);
  const hits = raycaster.intersectObjects(allMeshes, false);
  const hit = hits.find(h => h.object.visible && h.object.userData.ids && h.object.userData.ids.length
                          && h.object.material.opacity > 0.2
                          && h.object.userData.ids[0] !== 's-terrain');
  if(!hit) return;
  const ids = new Set(hit.object.userData.ids);
  const twin = hit.object.userData.twin;
  let bestTwin = twin;
  if(state.twin && TWINS[state.twin].procs.some(p=>[...expand(p.f)].some(id=>ids.has(id)))){
    bestTwin = state.twin;
  } else {
    for(const k of ['plast','skv','dob']){
      if(TWINS[k].procs.some(p=>[...expand(p.f)].some(id=>ids.has(id)))){ bestTwin=k; break; }
    }
  }
  state.twin=bestTwin; state.procIdx=null; state.hoverIdx=null; state.linkedIds=ids;
  document.querySelectorAll('.twbtn').forEach(b=>b.classList.toggle('active', b.id==='tw-'+bestTwin));
  buildPanel(bestTwin, ids);
  elPanel.classList.add('open');
  const first = hit.object.userData.ids[0];
  setHint(`Объект: ${(LABELS[first]||first).toUpperCase()} · связанные процессы отмечены`);
  applyState();
});

addEventListener('keydown', e=>{
  if(e.key==='F' || e.key==='f' || e.key==='А' || e.key==='а'){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
    return;
  }
  if(document.body.classList.contains('clean') && e.key === 'Escape'){
    document.body.classList.remove('clean');
    return;
  }
  if(state.show){
    if(e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); setStep(state.step+1); }
    else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); setStep(state.step-1); }
    else if(e.key==='a' || e.key==='A' || e.key==='ф' || e.key==='Ф'){ state.auto=!state.auto; state.lastStep=performance.now(); }
    else if(e.key==='Escape'){ exitShow(); }
  } else {
    if(e.key==='Escape'){
      if(state.sysFilter) setSysFilter(state.sysFilter);
      else selectTwin(null);
    }
  }
});

   10. АНИМАЦИОННЫЙ ЦИКЛ
   ================================================================ */
const clock = new THREE.Clock();

// Автонастройка качества: замер FPS первых секунд, при просадке — упрощаем рендер
let perfFrames = 0, perfAccum = 0, perfDone = LOW;
function degradeQuality(){
  composer = null; outlinePass = null;
  key.castShadow = false;
  renderer.shadowMap.enabled = false;
  renderer.setPixelRatio(1);
  setHint('Режим производительности: упрощённый рендер');
}
function perfSample(dt){
  if(perfDone) return;
  perfFrames++; perfAccum += dt;
  if(perfFrames >= 150){
    perfDone = true;
    const fps = perfFrames / perfAccum;
    if(fps < 40) degradeQuality();
  }
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  perfSample(dt);
  const t = clock.elapsedTime;
  const k = 1 - Math.exp(-dt*7);

  if(camTween){
    const kk = Math.min(1, (performance.now()-camTween.start)/camTween.dur);
    const e = easeInOutCubic(kk);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if(kk>=1) camTween = null;
  }
  if(state.show && state.auto && !REDUCED){
    if(!camTween){
      const off = camera.position.clone().sub(controls.target);
      off.applyAxisAngle(V3(0,1,0), dt*0.05);
      camera.position.copy(controls.target).add(off);
    }
    if(performance.now() - state.lastStep > 7000){
      if(state.step < STEPS.length-1) setStep(state.step+1);
      else state.auto = false;
    }
  }
  controls.update();

  // Плавные переходы материалов (подсветка/гашение/пульс)
  for(const m of allMeshes){
    const b = m.userData.base, tg = m.userData.tgt, mat = m.material;
    mat.opacity += (tg.opacity - mat.opacity)*k;
    if(mat.emissive && b.emissive !== null){
      if(tg.pulse){
        mat.emissive.lerp(new THREE.Color(tg.pulseColor || TWIN_COLORS[m.userData.twin] || '#F0AE4A'), k);
        const eT = REDUCED ? 0.85 : 0.55 + 0.45*Math.sin(t*Math.PI*2/1.5);
        mat.emissiveIntensity += (eT - mat.emissiveIntensity)*k;
      } else {
        mat.emissive.lerp(b.emissive, k);
        mat.emissiveIntensity += ((tg.eInt===0 ? 0 : b.eInt) - mat.emissiveIntensity)*k;
      }
    }
    if(mat.color && b.color){
      const want = b.color.clone().lerp(GHOST, tg.desat);
      mat.color.lerp(want, k);
    }
    mat.depthWrite = b.depthWrite && mat.opacity > 0.45;
  }

  // «Разнести слои»
  for(const name in gStrata){
    const g = gStrata[name];
    const target = state.exploded ? g.userData.explodeOffset : 0;
    g.position.y += (target - g.position.y) * (REDUCED ? 1 : Math.min(1, dt/1.2*3));
  }

  // Потоки: нефть / вода ППД / реагент — разные скорости
  if(state.flow) for(const f of flowPipeMats) f.mat.map.offset.x -= dt*f.speed;

  // Аниматоры: качалка, буровая, факел, транспорт, телеметрия, фронт, закачка
  for(const a of animators) a.fn(t, dt);

  // Дрейф дымки
  scene.fog.density = 0.00034 + 0.00006*Math.sin(t*0.13);

  if(composer) composer.render(); else renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  if(composer) composer.setSize(innerWidth, innerHeight);
});

/* ================================================================
   11. ЗАГРУЗКА
   ================================================================ */
const loadSteps = ['Структура недр','Разлом и залежь','Восемь стволов','Нефтесбор и ЦППН','Системный слой','Первый кадр'];
let stepI = 0;
function tickLoad(){
  const bar=$('bar'), msg=$('loadmsg');
  if(stepI < loadSteps.length){
    msg.textContent = loadSteps[stepI] + '…';
    bar.style.width = Math.round((stepI+1)/loadSteps.length*100)+'%';
    stepI++;
    requestAnimationFrame(tickLoad);
  } else {
    $('loader').classList.add('done');
    applyState();
    animate();
  }
}
tickLoad();
</script>
</body>
</html>
